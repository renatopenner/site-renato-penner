name = "pennertech-router"
main = "worker.js"
compatibility_date = "2026-11-11"

# Roda em pennertech.com.br/* (o worker decide: /loja -> GitHub Pages,
# raiz -> portal). Troque por rotas específicas quando os serviços da
# raiz entrarem no ar.
routes = [
  { pattern = "pennertech.com.br/*", zone_name = "pennertech.com.br" },
  { pattern = "www.pennertech.com.br/*", zone_name = "pennertech.com.br" }
]
